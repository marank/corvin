# Fast checks before each commit; the full set is the VS Code `check` task (and CI).
# Install once: uv tool run pre-commit install   (versions are kept current by Renovate)
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
        # JSONC (comments allowed): VS Code and tsconfig files
        exclude: ^(\.vscode/|frontend/tsconfig.*\.json$)
      - id: check-merge-conflict
      - id: check-added-large-files

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.3
    hooks:
      - id: ruff-check
        args: [--fix]
        files: ^backend/

# Optional PostgreSQL for native development (`just db-up`), to run
# the app and the tests against the same database as CI and production. Natively the app
# uses SQLite by default; set DB_HOST=localhost in .env to use this one instead. Jobs then
# wait in the queue until `uv run python manage.py procrastinate worker` runs (in backend/).
name: corvin-dev

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-corvin}
      POSTGRES_USER: ${DB_USER:-corvin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - db-dev-data:/var/lib/postgresql

volumes:
  db-dev-data:

# Security headers for everything nginx serves itself (SPA, assets, static files).
# Included in each location, because add_header in a location drops inherited ones.
# Django sets its own headers (incl. CSP) for /api and /django-admin.
#
# CSP: no inline scripts anywhere in the SPA; this also covers the designer preview, whose
# srcdoc iframe inherits the app's policy. Inline styles: PrimeVue and the templates.
# Permissions-Policy: the same list as PERMISSIONS_POLICY in backend/config/settings.py.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-src 'self' blob:; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "same-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), serial=(), bluetooth=(), hid=(), midi=(), magnetometer=(), gyroscope=(), accelerometer=(), browsing-topics=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;


# Corvin's site, included in nginx's http context (docker/nginx.conf). nginx serves the SPA
# and proxies /api/ to gunicorn in the same container. Unprivileged on a read-only
# filesystem: port 8080, runtime files in /tmp.

# Real client address. A TLS proxy in front (Caddy, Traefik, …) must be listed in
# TRUSTED_PROXIES (.env); start-nginx renders these includes at start. Without it,
# X-Forwarded-For/-Proto from clients are ignored, so nobody can fake them.
include /tmp/nginx/realip.conf;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

geo $realip_remote_addr $from_trusted_proxy {
    default 0;
    include /tmp/nginx/geo.conf;
}

# The proxy's X-Forwarded-Proto counts only when it comes from a trusted proxy.
map "$from_trusted_proxy:$http_x_forwarded_proto" $forwarded_proto {
    default  $scheme;
    "1:https" https;
    "1:http"  http;
}

server {
    listen 8080;
    server_name _;
    root /srv/spa;
    index index.html;

    # Inherited by every proxied location below. X-Forwarded-For is replaced, not
    # appended: Django (NUM_PROXIES = 1) takes the last entry as the client.
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;

    # Login/register brute-force limit per client address (zone in nginx.conf).
    location ~ ^/api/v1/auth/(login|register)$ {
        limit_req zone=auth burst=5 nodelay;
        proxy_pass http://127.0.0.1:8000;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
    }

    # Not in nginx's stock mime.types; browsers want the proper type for the PWA manifest.
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        include /etc/nginx/security_headers.conf;
    }

    location / {
        include /etc/nginx/security_headers.conf;
        try_files $uri $uri/ /index.html;
    }
}

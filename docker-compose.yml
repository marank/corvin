services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-projectmanager}
      POSTGRES_USER: ${POSTGRES_USER:-pm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    image: ${BACKEND_IMAGE:-projectmanager-backend}
    restart: unless-stopped
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      DATABASE_URL: postgres://${POSTGRES_USER:-pm}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-projectmanager}
    volumes:
      - media:/app/media
    depends_on:
      db:
        condition: service_healthy

  # Creates the invoices of due support contracts once a day (process_recurring).
  # Same image as the backend; idempotent, so a restart never bills twice.
  scheduler:
    image: ${BACKEND_IMAGE:-projectmanager-backend}
    restart: unless-stopped
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      DATABASE_URL: postgres://${POSTGRES_USER:-pm}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-projectmanager}
      TZ: ${TIME_ZONE:-Europe/Berlin}
      RUN_AT: ${RECURRING_TIME:-06:00}
    command: ["sh", "scripts/daily.sh", "uv", "run", "--no-sync", "python", "manage.py", "process_recurring"]
    healthcheck:
      disable: true
    depends_on:
      backend:
        condition: service_healthy

  frontend:
    build: ./frontend
    image: ${FRONTEND_IMAGE:-projectmanager-frontend}
    restart: unless-stopped
    environment:
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
    ports:
      - "${HTTP_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy

  # Nightly pg_dump plus a tarball of the uploaded files (docker/backup.sh) into the
  # "backups" volume. Manual run:   docker compose exec backup sh /backup.sh now
  # Copy off the host:              docker compose cp backup:/var/lib/postgresql/backups ./backups
  # Restore: see README.
  backup:
    image: postgres:17-alpine
    restart: unless-stopped
    entrypoint: ["sh", "/backup.sh"]
    user: postgres
    environment:
      PGHOST: db
      PGDATABASE: ${POSTGRES_DB:-projectmanager}
      PGUSER: ${POSTGRES_USER:-pm}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      TZ: ${TIME_ZONE:-Europe/Berlin}
      BACKUP_TIME: ${BACKUP_TIME:-02:30}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ./docker/backup.sh:/backup.sh:ro
      - media:/media:ro
      # The image's postgres-owned home, so the fresh volume is writable for the
      # postgres user without extra capabilities.
      - backups:/var/lib/postgresql
    depends_on:
      db:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  pgdata:
  media:
  backups:

services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-corvin}
      POSTGRES_USER: ${DB_USER:-corvin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set in .env}
    volumes:
      # PostgreSQL 18+ keeps its data under /var/lib/postgresql/<major>/docker, so
      # major upgrades (pg_upgrade) can work side by side in the same volume.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    image: ${BACKEND_IMAGE:-corvin-backend}
    restart: unless-stopped
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      DB_TYPE: postgres
      DB_HOST: db
      DB_PORT: "5432"
    volumes:
      - media:/app/media
    depends_on:
      db:
        condition: service_healthy
    # Unprivileged, no capabilities, read-only root filesystem; writable are only
    # the volumes and /tmp.
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  # Creates the invoices of due support contracts once a day (process_recurring).
  # Same image as the backend; idempotent, so a restart never bills twice.
  scheduler:
    image: ${BACKEND_IMAGE:-corvin-backend}
    restart: unless-stopped
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      DB_TYPE: postgres
      DB_HOST: db
      DB_PORT: "5432"
      TZ: ${TIME_ZONE:-Europe/Berlin}
      RUN_AT: ${RECURRING_TIME:-06:00}
    command: ["sh", "scripts/daily.sh", "python", "manage.py", "process_recurring"]
    healthcheck:
      disable: true
    depends_on:
      backend:
        condition: service_healthy
    # Unprivileged, no capabilities, read-only root filesystem; writable are only
    # the volumes and /tmp.
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  frontend:
    build: ./frontend
    image: ${FRONTEND_IMAGE:-corvin-frontend}
    restart: unless-stopped
    environment:
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
    ports:
      - "${APP_PORT:-80}:8080"
    depends_on:
      backend:
        condition: service_healthy
    # Unprivileged, no capabilities, read-only root filesystem; writable are only
    # the volumes and /tmp.
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  # Nightly pg_dump plus a tarball of the uploaded files (docker/backup.sh) into the
  # "backups" volume. Manual run:   docker compose exec backup sh /backup.sh now
  # Copy off the host:              docker compose cp backup:/var/lib/postgresql/backups ./backups
  # Restore: see README.
  backup:
    image: postgres:18-alpine
    restart: unless-stopped
    entrypoint: ["sh", "/backup.sh"]
    user: postgres
    environment:
      PGHOST: db
      PGDATABASE: ${DB_NAME:-corvin}
      PGUSER: ${DB_USER:-corvin}
      PGPASSWORD: ${DB_PASSWORD}
      TZ: ${TIME_ZONE:-Europe/Berlin}
      BACKUP_TIME: ${BACKUP_TIME:-02:30}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ./docker/backup.sh:/backup.sh:ro
      - media:/media:ro
      # The image's postgres-owned home, so the fresh volume is writable for the
      # postgres user without extra capabilities.
      - backups:/var/lib/postgresql
    depends_on:
      db:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  pgdata:
  media:
  backups:

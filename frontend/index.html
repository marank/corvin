<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Corvin</title>
    <meta name="description" content="Project management for IT consultants: time tracking, projects, support contracts and invoices." />
    <meta name="application-name" content="Corvin" />
    <meta name="apple-mobile-web-app-title" content="Corvin" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#18181b" media="(prefers-color-scheme: dark)" />
    <!-- Icons and manifest are generated from branding/ (see README, Branding). -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- Link previews (Open Graph / Twitter). Crawlers expect an absolute og:image URL;
         relative works for most chat apps, Facebook/LinkedIn need the full origin. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Corvin" />
    <meta property="og:title" content="Corvin" />
    <meta property="og:description" content="Project management for IT consultants: time tracking, projects, support contracts and invoices." />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

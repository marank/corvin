# Included in nginx's http context (conf.d/default.conf in the nginx image).
# Runs unprivileged on a read-only filesystem: port 8080, runtime files in /tmp.

# Real client address. A TLS proxy in front (Caddy, Traefik, …) must be listed in
# TRUSTED_PROXIES (.env); docker/40-trusted-proxies.sh renders these includes at start.
# Without it, X-Forwarded-For/-Proto from clients are ignored, so nobody can fake them.
include /tmp/nginx-trusted/realip.conf;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

geo $realip_remote_addr $from_trusted_proxy {
    default 0;
    include /tmp/nginx-trusted/geo.conf;
}

# The proxy's X-Forwarded-Proto counts only when it comes from a trusted proxy.
map "$from_trusted_proxy:$http_x_forwarded_proto" $forwarded_proto {
    default  $scheme;
    "1:https" https;
    "1:http"  http;
}

# Login/register brute-force limit per client address (shared by all workers).
limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
limit_req_status 429;

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 20m;

    # Inherited by every proxied location below. X-Forwarded-For is replaced, not
    # appended: Django (NUM_PROXIES = 1) takes the last entry as the client.
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;

    location ~ ^/api/v1/auth/(login|register)$ {
        limit_req zone=auth burst=5 nodelay;
        proxy_pass http://backend:8000;
    }

    location /api/ {
        proxy_pass http://backend:8000;
    }

    location / {
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy same-origin always;
        try_files $uri $uri/ /index.html;
    }
}

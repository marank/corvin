# Weekly dependency updates, minor and patch versions in one pull request per area;
# majors one by one. Every ecosystem waits 7 days after a release (cooldown) before
# proposing it: a hijacked release is usually found and pulled within days. Security
# updates are not delayed. Commit SHAs (workflows) and image digests (Dockerfile) are
# updated together with their tag. Not covered (bump by hand, see AGENTS.md): TRIVY_IMAGE in
# build.yaml (started with `docker run`), SUPERVISOR_VERSION and PG_MAJOR in the Dockerfile,
# the tool versions in the justfile (actionlint, zizmor) and the workflows (just), and pnpm's
# packageManager field if Dependabot leaves it alone.
# No automerge: updates are merged by a person after green CI.
version: 2
updates:
  - package-ecosystem: uv
    directory: /backend
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: "deps"
      prefix-development: "chore(deps)"
    groups:
      backend:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: "deps"
      prefix-development: "chore(deps)"
    groups:
      frontend:
        update-types: [minor, patch]
    ignore:
      # Follows the Node major of the image (node:26 in the Dockerfile and CI).
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]
      # PrimeVue 5, @primeuix/themes 3 and primeicons 8 need a commercial license key
      # (see AGENTS.md); stay on the MIT majors until that is decided.
      - dependency-name: primevue
        update-types: [version-update:semver-major]
      - dependency-name: "@primeuix/themes"
        update-types: [version-update:semver-major]
      - dependency-name: "@primevue/*"
        update-types: [version-update:semver-major]
      - dependency-name: primeicons
        update-types: [version-update:semver-major]
      # TypeScript 7 (native) has no JS API yet, which vue-tsc needs.
      - dependency-name: typescript
        update-types: [version-update:semver-major]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: "deps"
    ignore:
      # Node: only even majors (LTS lines). Python minors need a look at requires-python
      # and wheel support; they still come, as single PRs.
      - dependency-name: node
        versions: ["27.x", "29.x"]

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: "deps"
    ignore:
      # A PostgreSQL major upgrade needs a dump and restore of the data.
      - dependency-name: postgres
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(deps)"
    groups:
      actions:
        update-types: [minor, patch]

  - package-ecosystem: pre-commit
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(deps)"

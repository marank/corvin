# Pull request title: a Conventional Commit.
#
# With squash merging the PR title becomes the commit message on main, and release-please
# builds the changelog and the next version from those messages. Its own workflow, so that
# editing a title runs only this job and not the whole build; make `pr-title` a required
# status check. The title reaches the script through the environment only.
name: pr-title

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions: {}

jobs:
  pr-title:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0

      - name: Install just
        run: uv tool install rust-just==1.59.0

      - name: Check the title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: just check-pr-title "$TITLE"

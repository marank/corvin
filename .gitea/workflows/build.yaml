# CI: lint and test the backend, type-check and build the frontend, scan the repository,
# then build both images, smoke-test the compose stack, scan the images and push them to
# the Gitea container registry (same host as this Gitea instance).
#
# Required repository secrets:
#   REGISTRY_USER   Gitea user that owns (or may write to) the packages
#   REGISTRY_TOKEN  access token with the "write:package" scope
#
# Pull requests only run the checks and a test build; pushes to main and
# version tags (v1.2.3) also push the images (<repo>/backend, <repo>/frontend).
# The same checks run locally with the VS Code task "check".
name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ gitea.workflow }}-${{ gitea.ref }}
  cancel-in-progress: true

# The jobs only read the repository; the registry login uses its own token.
permissions:
  contents: read

env:
  # Started with `docker run` below; renovate.json updates it via a regex manager.
  TRIVY_IMAGE: aquasec/trivy:0.76.1

jobs:
  # --- Backend: ruff, deptry, licenses, migrations, checks, pytest --------------------
  backend:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/astral-sh/uv:python3.15-trixie-slim
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: ci
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
        options: >-
          --health-cmd "pg_isready -U ci -d ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      UV_LINK_MODE: copy
      UV_PYTHON_DOWNLOADS: never
      # Tests run against PostgreSQL like production, with the development settings.
      DATABASE_URL: postgres://ci:ci@postgres:5432/ci
    defaults:
      run:
        working-directory: backend
    steps:
      # builtin:checkout needs git; WeasyPrint needs the same libraries as the Dockerfile.
      # working-directory: / because backend/ does not exist yet.
      - name: Install system packages
        working-directory: /
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates \
            libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0 libjpeg62-turbo libopenjp2-7

      - uses: builtin:checkout

      - name: Install dependencies
        # --locked also fails when uv.lock no longer matches pyproject.toml.
        run: uv sync --locked

      - name: Lint
        run: |
          uv run ruff check --output-format=concise .
          uv run ruff format --check .

      # Every declared package is imported, every imported one declared.
      - name: Unused dependencies
        run: uv run deptry .

      # Production dependencies only: must be compatible with the app's AGPL-3.0-or-later
      # (no GPL-2.0-only, SSPL, proprietary, …; details in scripts/check_licenses.py).
      - name: Licenses
        run: |
          LICENSE_DIR=$(mktemp -d)
          trap 'rm -rf "$LICENSE_DIR"' EXIT
          uv export --locked --no-dev --no-hashes --format requirements.txt -o "$LICENSE_DIR/requirements.txt"
          uv venv --quiet "$LICENSE_DIR/venv"
          uv pip install --quiet --python "$LICENSE_DIR/venv" -r "$LICENSE_DIR/requirements.txt" pip-licenses
          "$LICENSE_DIR/venv/bin/pip-licenses" --format=json \
            --ignore-packages pip-licenses prettytable wcwidth \
            | uv run python scripts/check_licenses.py

      - name: Check for missing migrations
        run: uv run python manage.py makemigrations --check --dry-run

      - name: Django system checks
        run: uv run python manage.py check --fail-level WARNING

      # Production settings: secure cookies, SSL redirect, no warnings left.
      - name: Django deploy checks
        env:
          DJANGO_SETTINGS_MODULE: config.settings.production
          SECRET_KEY: ci-deploy-check-not-secret-but-long-and-random-enough-0123456789abcdef
          ALLOWED_HOSTS: app.example.com
          CSRF_TRUSTED_ORIGINS: https://app.example.com
        run: uv run python manage.py check --deploy --fail-level WARNING

      # Minimum coverage: fail_under in pyproject.toml.
      - name: Tests
        run: uv run pytest -q --cov

  # --- Frontend: type-check, build, licenses, audit ----------------------------------
  frontend:
    runs-on: ubuntu-latest
    container:
      image: node:26-trixie-slim
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Install git
        working-directory: /
        run: apt-get update && apt-get install -y --no-install-recommends git ca-certificates

      - uses: builtin:checkout

      # pnpm in the version of package.json's "packageManager" field, like the Dockerfile
      # (Node 25+ no longer ships corepack).
      - name: Install dependencies
        run: |
          npm install --global corepack@0.36.0
          corepack enable
          pnpm install --frozen-lockfile

      # vue-tsc type-check + vite build
      - name: Build
        run: pnpm build

      - name: Licenses
        run: pnpm check:licenses

      # Known vulnerabilities in the dependencies that end up in the browser.
      - name: Audit
        run: pnpm audit --prod --audit-level high

  # --- Repository: committed secrets, vulnerable lock files, Dockerfiles ---------------
  repository:
    runs-on: ubuntu-latest
    steps:
      - uses: builtin:checkout

      # Secrets, critical fixable vulnerabilities and Dockerfile misconfigurations fail
      # (exceptions with reasons in .trivyignore); HIGH vulnerabilities are reported.
      # The runner talks to a Docker-in-Docker daemon, so a bind mount of the checkout
      # would show an empty directory; the files are streamed in as a tar archive.
      - name: Scan
        run: |
          trivy() {
            tar -c --exclude=.git --exclude=node_modules --exclude=.venv . \
              | docker run --rm -i -v trivy-cache:/root/.cache/trivy \
                  --entrypoint sh "$TRIVY_IMAGE" -c \
                  'mkdir /src && tar -x -C /src &&
                   test -f /src/backend/Dockerfile -a -f /src/backend/uv.lock || { echo "nothing to scan" >&2; exit 2; }
                   cd /src && exec trivy fs --no-progress --skip-version-check --ignorefile .trivyignore "$@" /src' \
                  trivy "$@"
          }
          trivy --scanners secret --exit-code 1
          trivy --scanners vuln --severity CRITICAL --ignore-unfixed --exit-code 1
          trivy --scanners misconfig --severity HIGH,CRITICAL --exit-code 1
          trivy --scanners vuln --severity HIGH

  # --- Images: build, smoke-test, scan, push ----------------------------------------
  image:
    needs: [backend, frontend, repository]
    runs-on: ubuntu-latest
    env:
      DOCKER_BUILDKIT: "1"
      PUSH: ${{ gitea.event_name != 'pull_request' }}
    steps:
      - uses: builtin:checkout

      - name: Compute tags
        id: meta
        # Context values go in via env, never straight into the script: tag names
        # may contain shell metacharacters.
        env:
          SERVER_URL: ${{ gitea.server_url }}
          REPO: ${{ gitea.repository }}
          REF: ${{ gitea.ref }}
          REF_NAME: ${{ gitea.ref_name }}
          SHA: ${{ gitea.sha }}
        run: |
          # Gitea's container registry lives on the instance's own host.
          REGISTRY=$(echo "$SERVER_URL" | sed -E 's#^[a-z]+://##; s#/.*$##')
          BASE=$(echo "$REGISTRY/$REPO" | tr '[:upper:]' '[:lower:]')
          SHORT_SHA=$(echo "$SHA" | cut -c1-12)
          SUFFIXES="sha-$SHORT_SHA"
          case "$REF" in
            refs/heads/main)
              SUFFIXES="$SUFFIXES latest"
              ;;
            refs/tags/v*)
              VERSION="${REF_NAME#v}"
              # Only docker-safe tag names; the tags end up in later scripts.
              if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
                echo "Invalid version tag: $REF_NAME" >&2
                exit 1
              fi
              SUFFIXES="$SUFFIXES $VERSION"
              # Also tag 1.2 and 1 for plain releases (no -rc/-beta suffix).
              if echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
                SUFFIXES="$SUFFIXES ${VERSION%.*} ${VERSION%%.*}"
              fi
              ;;
          esac
          {
            echo "registry=$REGISTRY"
            echo "backend=$BASE/backend:sha-$SHORT_SHA"
            echo "frontend=$BASE/frontend:sha-$SHORT_SHA"
            echo "base=$BASE"
            echo "suffixes=$SUFFIXES"
          } >> "$GITHUB_OUTPUT"
          echo "Tags: $SUFFIXES"

      - name: Login
        if: env.PUSH == 'true'
        env:
          REGISTRY: ${{ steps.meta.outputs.registry }}
          REGISTRY_USER: ${{ secrets.REGISTRY_USER }}
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: echo "$REGISTRY_TOKEN" | docker login "$REGISTRY" -u "$REGISTRY_USER" --password-stdin

      # Throwaway secrets for the smoke test; compose needs the file for every command.
      - name: Smoke-test environment
        run: |
          SECRET=$(head -c 48 /dev/urandom | base64 | tr -d '/+=')
          sed -e "s/^SECRET_KEY=.*/SECRET_KEY=$SECRET/" \
              -e "s/^ALLOWED_HOSTS=.*/ALLOWED_HOSTS=app.example.com/" \
              -e "s#^CSRF_TRUSTED_ORIGINS=.*#CSRF_TRUSTED_ORIGINS=https://app.example.com#" \
              -e "s/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=smoke-$SECRET/" \
              -e "s/^TRUSTED_PROXIES=.*/TRUSTED_PROXIES=127.0.0.1/" \
              -e "s/^HTTP_PORT=.*/HTTP_PORT=0/" \
              .env.example > .env

      - name: Build
        env:
          BACKEND_IMAGE: ${{ steps.meta.outputs.backend }}
          FRONTEND_IMAGE: ${{ steps.meta.outputs.frontend }}
        run: docker compose build --pull backend frontend

      # Start db, backend, scheduler and frontend from the just-built images, so images that cannot boot are never pushed. Probes go through
      # nginx from inside the frontend container, which acts as the trusted TLS proxy
      # (TRUSTED_PROXIES=127.0.0.1), like production behind Caddy/Traefik.
      - name: Smoke test
        env:
          BACKEND_IMAGE: ${{ steps.meta.outputs.backend }}
          FRONTEND_IMAGE: ${{ steps.meta.outputs.frontend }}
          COMPOSE_PROJECT_NAME: smoke-${{ gitea.run_id }}
        run: |
          trap 'docker compose logs || true; docker compose down -v || true; rm -f .env' EXIT
          docker compose up -d --no-build db backend scheduler frontend

          healthy=false
          for i in $(seq 1 60); do
            if [ "$(docker compose ps frontend --format '{{.Health}}')" = healthy ]; then
              echo "Healthy after ${i}x3s"; healthy=true; break
            fi
            sleep 3
          done
          if [ "$healthy" != true ]; then
            echo "Stack did not become healthy" >&2
            exit 1
          fi

          probe() {
            path=$1; expected=$2; shift 2
            # wget exits non-zero on 4xx, so its status line is read from the output.
            status=$( (docker compose exec -T frontend wget -S -q -O /dev/null \
              --header "Host: app.example.com" --header "X-Forwarded-Proto: https" "$@" \
              "http://127.0.0.1:8080$path" 2>&1 || true) | awk '/HTTP\//{print $2; exit}')
            echo "$path: $status"
            [ "$status" = "$expected" ]
          }
          probe /api/v1/health 200
          probe / 200
          probe /invoices 200
          probe /api/v1/auth/me 401
          # Login without CSRF token is refused.
          probe /api/v1/auth/login 403 --post-data '{}' --header 'Content-Type: application/json'
          if [ "$(docker compose ps scheduler --format '{{.State}}')" != running ]; then
            echo "Scheduler is not running" >&2
            exit 1
          fi
          echo "Stack boots and serves SPA and API"

      # Known vulnerabilities (OS packages, Python wheels) and secrets baked into the
      # images. Critical fixable ones block the push; HIGH is reported. The runner talks
      # to a Docker-in-Docker daemon, so the image is streamed in with docker save.
      - name: Vulnerability scan
        env:
          BACKEND_IMAGE: ${{ steps.meta.outputs.backend }}
          FRONTEND_IMAGE: ${{ steps.meta.outputs.frontend }}
        run: |
          trivy() {
            image=$1; shift
            docker save "$image" \
              | docker run --rm -i -v trivy-cache:/root/.cache/trivy \
                  --entrypoint sh "$TRIVY_IMAGE" -c \
                  'cat > /tmp/image.tar &&
                   exec trivy image --no-progress --skip-version-check --ignore-unfixed \
                     --input /tmp/image.tar "$@"' \
                  trivy "$@"
          }
          for image in "$BACKEND_IMAGE" "$FRONTEND_IMAGE"; do
            echo "== $image"
            trivy "$image" --scanners vuln,secret --severity CRITICAL --exit-code 1
            trivy "$image" --scanners vuln --severity HIGH
          done

      - name: Push
        if: env.PUSH == 'true'
        env:
          BASE: ${{ steps.meta.outputs.base }}
          SUFFIXES: ${{ steps.meta.outputs.suffixes }}
          BACKEND_IMAGE: ${{ steps.meta.outputs.backend }}
          FRONTEND_IMAGE: ${{ steps.meta.outputs.frontend }}
        run: |
          read -ra suffix_list <<< "$SUFFIXES"
          for part in backend frontend; do
            [ "$part" = backend ] && src="$BACKEND_IMAGE" || src="$FRONTEND_IMAGE"
            for s in "${suffix_list[@]}"; do
              docker tag "$src" "$BASE/$part:$s"
              docker push "$BASE/$part:$s"
            done
          done

      - name: Logout
        if: always() && env.PUSH == 'true'
        env:
          REGISTRY: ${{ steps.meta.outputs.registry }}
        run: docker logout "$REGISTRY"

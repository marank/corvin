# Production: PostgreSQL and Corvin. Works with a .env next to it and nothing else from the
# repository: copy this file and .env.example to the server, fill in .env, `docker compose up -d`.
name: corvin

# Hardened: unprivileged, without capabilities, nothing but the volumes and /tmp writable.
x-hardened: &hardened
  read_only: true
  tmpfs:
    - /tmp
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

# The image CI pushes; APP_IMAGE pins a version (ghcr.io/marank/corvin:1.2) or points at a
# local build (`just docker-up`, which builds `corvin` from the checkout).
x-app-environment: &app-environment
  DEBUG: "false"
  DB_TYPE: postgres
  DB_HOST: db
  DB_PORT: "5432"

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-corvin}
      POSTGRES_USER: ${DB_USER:-corvin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    volumes:
      # PostgreSQL 18+ keeps its data under /var/lib/postgresql/<major>/docker, so
      # major upgrades (pg_upgrade) can work side by side in the same volume.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # nginx (SPA, /api proxy, login rate limit) and gunicorn/Django under supervisord.
  # Migrates and creates the ADMIN_USERNAME account on start.
  app:
    <<: *hardened
    image: ${APP_IMAGE:-ghcr.io/marank/corvin:latest}
    restart: unless-stopped
    env_file: .env
    environment: *app-environment
    ports:
      - "${APP_PORT:-80}:8080"
    volumes:
      - media:/app/media
    depends_on:
      db:
        condition: service_healthy

  # Background jobs (core/tasks.py): invoice mails, the daily recurring invoices at
  # RECURRING_TIME, the nightly backup at BACKUP_TIME. Same image, own container, so it has
  # its own logs, restarts and health check. Waits until the app has migrated.
  worker:
    <<: *hardened
    image: ${APP_IMAGE:-ghcr.io/marank/corvin:latest}
    restart: unless-stopped
    command: ["sh", "/usr/local/bin/worker"]
    # A minimal init as PID 1 forwards `docker stop` and reaps finished child processes.
    init: true
    env_file: .env
    environment: *app-environment
    volumes:
      - media:/app/media
      # Database dump + uploads tarball every night. Manual backup:
      #   docker compose exec worker python manage.py backup
      # Copy off the host: docker compose cp worker:/backups ./backups
      - backups:/backups
    healthcheck:
      # The image's HTTP health check is for the app; this checks the worker's database link.
      test: ["CMD", "python", "manage.py", "procrastinate", "healthchecks"]
      interval: 60s
      timeout: 10s
      start_period: 60s
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  media:
  backups:

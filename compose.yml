# Corvin and PostgreSQL. Put this file and a .env (copy of .env.example) in one folder on the
# server, fill in .env, run `docker compose up -d`.
name: corvin

# Hardening for every container: read-only, unprivileged, no extra rights.
x-hardened: &hardened
  read_only: true
  tmpfs:
    - /tmp
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-corvin}
      POSTGRES_USER: ${DB_USER:-corvin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    volumes:
      # The database. A newer Postgres major version needs a dump and restore, not just a new
      # image tag.
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # The web app: migrates and creates the ADMIN_USERNAME account on start.
  app:
    <<: *hardened
    # `latest` follows every release; set APP_IMAGE in .env to pin a version.
    image: ${APP_IMAGE:-ghcr.io/marank/corvin:latest}
    restart: unless-stopped
    env_file: .env
    environment:
      DEBUG: "false"
      DB_HOST: db
      DB_PORT: "5432"
    ports:
      - "${APP_BIND:-80}:8080"
    volumes:
      - app-data:/data
    depends_on:
      db:
        condition: service_healthy

  # Background jobs: invoice mails, the daily recurring invoices, the nightly backup. Same
  # image as the app.
  worker:
    <<: *hardened
    image: ${APP_IMAGE:-ghcr.io/marank/corvin:latest}
    restart: unless-stopped
    command: ["sh", "/usr/local/bin/worker"]
    # Lets `docker stop` end the worker cleanly.
    init: true
    env_file: .env
    environment:
      DEBUG: "false"
      DB_HOST: db
      DB_PORT: "5432"
    volumes:
      - app-data:/data
      # Nightly backup (BACKUP_TIME and BACKUP_KEEP_DAYS in .env). Back up now:
      #   docker compose exec worker python manage.py backup_database
      # Copy backups off the server: docker compose cp worker:/backups ./backups
      - backups:/backups
    healthcheck:
      # Checks that the worker reaches the database.
      test: ["CMD", "python", "manage.py", "procrastinate", "healthchecks"]
      interval: 60s
      timeout: 10s
      start_period: 60s
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
  app-data:
  backups:
